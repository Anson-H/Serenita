<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#163b47" />
    <title>鹈鹕骑行俱乐部</title>
    <style>
      :root {
        --ink: #163b47;
        --cream: #fff3d6;
        --sun: #f4c44e;
        --sky: #acdcd7;
        --sea: #3e8794;
        --road: #db6f5f;
        --coral: #ca4650;
        --orange: #ed963d;
        --mint: #78b7a7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--ink);
      }

      .stage {
        width: 100vw;
        height: 100vh;
        min-height: 360px;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        user-select: none;
      }

      .outline {
        stroke: var(--ink);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .fine-line {
        stroke: var(--ink);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .cloud-a {
        animation: cloud-drift 24s linear infinite;
      }

      .cloud-b {
        animation: cloud-drift 31s linear -12s infinite reverse;
      }

      .ocean-line {
        animation: ocean-slide 4s linear infinite;
      }

      .road-line {
        animation: road-slide 0.9s linear infinite;
      }

      .roadside {
        animation: roadside-pass 5.5s linear infinite;
      }

      .roadside.second {
        animation-delay: -2.75s;
      }

      #bike-and-bird {
        animation: ride-bob 0.55s ease-in-out infinite alternate;
        transform-origin: 600px 540px;
      }

      #pelican-body {
        animation: body-breathe 1.1s ease-in-out infinite alternate;
        transform-origin: 500px 315px;
      }

      #wing {
        animation: wing-flutter 1.1s ease-in-out infinite alternate;
        transform-origin: 465px 300px;
      }

      #tail-feathers {
        animation: tail-flick 0.55s ease-in-out infinite alternate;
        transform-origin: 382px 327px;
      }

      #crest {
        animation: crest-flick 0.7s ease-in-out infinite alternate;
        transform-origin: 610px 164px;
      }

      #scarf-tail-top {
        animation: scarf-wave-top 0.75s ease-in-out infinite alternate;
        transform-origin: 594px 235px;
      }

      #scarf-tail-bottom {
        animation: scarf-wave-bottom 0.62s ease-in-out infinite alternate-reverse;
        transform-origin: 594px 240px;
      }

      #bike-bell {
        animation: bell-ring 2.4s ease-in-out infinite;
        transform-origin: 696px 370px;
      }

      #rider-eye {
        animation: blink 4.8s linear infinite;
        transform-origin: center;
      }

      #shadow {
        animation: shadow-pulse 0.55s ease-in-out infinite alternate;
        transform-origin: 600px 638px;
      }

      #control {
        cursor: pointer;
        outline: none;
      }

      #control .control-fill {
        transition: fill 160ms ease, transform 160ms ease;
        transform-origin: 1057px 87px;
      }

      #control:hover .control-fill,
      #control:focus-visible .control-fill {
        fill: var(--sun);
        transform: scale(1.04);
      }

      svg.paused *,
      svg.paused *::before,
      svg.paused *::after {
        animation-play-state: paused !important;
      }

      @keyframes cloud-drift {
        from {
          transform: translateX(-120px);
        }
        to {
          transform: translateX(1320px);
        }
      }

      @keyframes ocean-slide {
        to {
          stroke-dashoffset: 132px;
        }
      }

      @keyframes road-slide {
        to {
          stroke-dashoffset: 260px;
        }
      }

      @keyframes roadside-pass {
        from {
          transform: translateX(780px);
        }
        to {
          transform: translateX(-860px);
        }
      }

      @keyframes ride-bob {
        from {
          transform: translateY(0) rotate(-0.15deg);
        }
        to {
          transform: translateY(-3px) rotate(0.15deg);
        }
      }

      @keyframes body-breathe {
        to {
          transform: rotate(1.2deg) translateY(-1px);
        }
      }

      @keyframes wing-flutter {
        from {
          transform: rotate(-2deg);
        }
        to {
          transform: rotate(5deg) translateY(-3px);
        }
      }

      @keyframes tail-flick {
        to {
          transform: rotate(-4deg);
        }
      }

      @keyframes crest-flick {
        to {
          transform: rotate(-7deg);
        }
      }

      @keyframes scarf-wave-top {
        to {
          transform: rotate(8deg) scaleX(1.04);
        }
      }

      @keyframes scarf-wave-bottom {
        to {
          transform: rotate(-7deg) scaleX(0.96);
        }
      }

      @keyframes bell-ring {
        0%,
        82%,
        100% {
          transform: rotate(0deg);
        }
        86% {
          transform: rotate(12deg);
        }
        90% {
          transform: rotate(-10deg);
        }
        94% {
          transform: rotate(6deg);
        }
      }

      @keyframes blink {
        0%,
        45%,
        49%,
        100% {
          transform: scaleY(1);
        }
        47% {
          transform: scaleY(0.08);
        }
      }

      @keyframes shadow-pulse {
        to {
          transform: scaleX(0.97);
          opacity: 0.15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        svg * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const svg = document.querySelector('#scene');
        const control = document.querySelector('#control');
        const controlLabel = document.querySelector('#control-label');
        const controlIcon = document.querySelector('#control-icon');
        const rearWheel = document.querySelector('#rear-wheel');
        const frontWheel = document.querySelector('#front-wheel');
        const crankArms = document.querySelector('#crank-arms');
        const frontThigh = document.querySelector('#front-thigh');
        const frontShin = document.querySelector('#front-shin');
        const frontKnee = document.querySelector('#front-knee');
        const frontFoot = document.querySelector('#front-foot');
        const backThigh = document.querySelector('#back-thigh');
        const backShin = document.querySelector('#back-shin');
        const backKnee = document.querySelector('#back-knee');
        const backFoot = document.querySelector('#back-foot');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const center = { x: 568, y: 542 };
        const frontHip = { x: 518, y: 370 };
        const backHip = { x: 501, y: 371 };
        const crankRadius = 38;
        const thighLength = 88;
        const shinLength = 105;
        const revolution = 1080;
        let paused = reduceMotion;
        let pauseStarted = 0;
        let pausedDuration = 0;

        function solveLeg(hip, pedal, bendDirection) {
          const dx = pedal.x - hip.x;
          const dy = pedal.y - hip.y;
          const distance = Math.min(Math.hypot(dx, dy), thighLength + shinLength - 0.1);
          const baseAngle = Math.atan2(dy, dx);
          const hipAngle = Math.acos(
            (thighLength ** 2 + distance ** 2 - shinLength ** 2) /
              (2 * thighLength * distance)
          );
          return {
            x: hip.x + Math.cos(baseAngle + hipAngle * bendDirection) * thighLength,
            y: hip.y + Math.sin(baseAngle + hipAngle * bendDirection) * thighLength,
          };
        }

        function drawLeg(prefix, hip, pedal, knee, direction) {
          const thigh = prefix === 'front' ? frontThigh : backThigh;
          const shin = prefix === 'front' ? frontShin : backShin;
          const kneeDot = prefix === 'front' ? frontKnee : backKnee;
          const foot = prefix === 'front' ? frontFoot : backFoot;

          thigh.setAttribute('d', `M ${hip.x} ${hip.y} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)}`);
          shin.setAttribute('d', `M ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${pedal.x.toFixed(2)} ${pedal.y.toFixed(2)}`);
          kneeDot.setAttribute('cx', knee.x.toFixed(2));
          kneeDot.setAttribute('cy', knee.y.toFixed(2));
          foot.setAttribute('d', `M ${(pedal.x - 10).toFixed(2)} ${(pedal.y + 2).toFixed(2)} h ${direction * 30}`);
        }

        function setControlState() {
          controlLabel.textContent = paused ? '继续' : '暂停';
          controlIcon.setAttribute('fill', paused ? 'var(--mint)' : 'var(--coral)');
          control.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
          svg.classList.toggle('paused', paused);
        }

        function togglePause() {
          if (paused) {
            pausedDuration += performance.now() - pauseStarted;
            paused = false;
          } else {
            pauseStarted = performance.now();
            paused = true;
          }
          setControlState();
        }

        control.addEventListener('click', (event) => {
          event.stopPropagation();
          togglePause();
        });

        control.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            togglePause();
          }
        });

        svg.addEventListener('click', togglePause);

        function animate(now) {
          const effectiveTime = paused ? pauseStarted - pausedDuration : now - pausedDuration;
          const angle = ((effectiveTime % revolution) / revolution) * Math.PI * 2;
          const degrees = (angle * 180) / Math.PI;

          rearWheel.setAttribute('transform', `translate(386 542) rotate(${degrees * 1.62})`);
          frontWheel.setAttribute('transform', `translate(806 542) rotate(${degrees * 1.62})`);
          crankArms.setAttribute('transform', `rotate(${degrees} ${center.x} ${center.y})`);

          const frontPedal = {
            x: center.x + Math.cos(angle) * crankRadius,
            y: center.y + Math.sin(angle) * crankRadius,
          };
          const backPedal = {
            x: center.x - Math.cos(angle) * crankRadius,
            y: center.y - Math.sin(angle) * crankRadius,
          };

          drawLeg('back', backHip, backPedal, solveLeg(backHip, backPedal, -1), -1);
          drawLeg('front', frontHip, frontPedal, solveLeg(frontHip, frontPedal, 1), 1);

          requestAnimationFrame(animate);
        }

        if (reduceMotion) {
          pauseStarted = performance.now();
        }
        setControlState();
        requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
