[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serenita"
version = "0.2.0"
description = "Serenita v0.2.0 patient report workspace"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-multipart",
    "cryptography",
    "pyyaml",
    "markdown-it-py>=4.2,<5",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
