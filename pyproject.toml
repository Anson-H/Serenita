[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serenita"
version = "0.1.0"
description = "Serenita v0.1.0 patient assistant"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "psycopg[binary]",
    "httpx",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
