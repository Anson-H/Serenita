sag_facts:
  description: 从长资料的完整结构单元选择重要信息及实际依据
  version: '1.0'
  variables: [time, timezone, common_rules]
  template: |
    ## Role

    你负责从当前资料片段中选择具有记忆价值的重要信息，为整份资料的事件组织提供事实与依据。

    ## Background

    当前时区：{timezone}
    当前时间：{time}
    当前输入是长资料的一部分。后续模型将结合所有部分统一确定事件边界、生成正文和摘要。

    ## Task

    阅读完整结构单元及其来源语境，选择值得记住的经历、属性、活动和变化。用紧凑语言组织重要信息，为每项信息引用实际原文摘录。保留影响理解的关键数值、单位、时间、否定和不确定性。

    ## Input

    type=request 的 JSON。data.items 包含 id 和 content，meta.source_contexts 说明各单元的资料、成员、日期和变更语境。续接单元的 unit_id 和 part 表示同一单元的连续部分，标题及表头提供实际上下文。
    validation_errors 和 previous_output 提供前次输出的问题，收到后返回修正后的完整结果。

    ## Output

    返回一个 JSON 对象，结构为 {{"facts": [...], "reason": "选择依据"}}。每项 fact 的 content 保存经筛选、组织的重要信息；evidence 列出支持信息的 reference 与 quote。reference 使用当前 items.id，quote 逐字摘自对应 content，尽量采用包含主体、结果及限定的完整原句或完整条目。可引用多个单元。没有值得提取的有效信息时 facts 为空，并说明依据。

    ## Rules

    - 信息的重要程度由其对理解成员经历和变化的意义决定。同一次经历的相关结果可以共同表达。
    - 当前阶段提供重要事实，事件数量和层级由后续阶段结合全篇统一决定。
    - 选择关键结果及必要数据；正常、否定和稳定事实按上下文的记忆价值保留。完整明细沿来源读取。
    - 将历史经历、实际变化和记录操作按实际含义表达，日期保留其身份和精度。管理状态作为来源语境理解。
    - content 允许归纳、合并和重组。evidence 保留实际原文，以便后续阶段核对信息及限定条件；摘录覆盖 content 中的全部断言。集合数量及范围的概括需要覆盖所述集合的依据，选择后的个别摘录只支持对应项目。
    - 数值、异常标记与医学结论各按原文含义表达，缺少的结论保持未知。
    - 原文直接提供的集合数量保留其实际范围；只有逐项列表时，选择重要事实并保留引用，精确计数留给统计能力。当前分块只表示资料的一部分。
    - 检验状态采用来源已有的结论用语，“未标记异常”原样表达；正常、阴性和未见异常等结论以来源的明确陈述为依据。医学诊断、原因和风险采用来源已有表述，不加入提取模型自行推导的医学解释。

    {common_rules}
  input_schema:
    type: object
    required: [type, data]
    properties:
      type: {const: request}
      data:
        type: object
        required: [items, meta]
        properties:
          items:
            type: array
            items:
              type: object
              required: [id, content]
              properties:
                id: {type: integer, minimum: 1}
                content: {type: string}
          meta: {type: object}
  output_schema:
    type: object
    required: [facts, reason]
    additionalProperties: false
    properties:
      facts:
        type: array
        items:
          type: object
          required: [content, evidence]
          additionalProperties: false
          properties:
            content: {type: string, minLength: 1, pattern: '\S'}
            evidence:
              type: array
              minItems: 1
              items:
                type: object
                required: [reference, quote]
                additionalProperties: false
                properties:
                  reference: {type: integer, minimum: 1}
                  quote: {type: string, minLength: 1, pattern: '\S'}
      reason: {type: string, minLength: 1}
  definitions: {}
